<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers - Crop Insurance System</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-card { background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid #e2e8f0; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: #64748b; }
        .form-group input, .form-group select { width: 100%; padding: 0.625rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: white; }
        .form-group input:focus, .form-group select:focus { border-color: #6366f1; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 90%; max-width: 600px; padding: 2rem; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; top: 1.5rem; right: 1.5rem; cursor: pointer; font-size: 1.5rem; color: #94a3b8; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
        .detail-item h4 { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.25rem; }
        .detail-item p { font-weight: 600; color: #1e293b; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-wheat-awn text-white"></i></div>
            <span>CropGuard AI</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
            <li class="nav-item"><a href="farmers.html" class="nav-link active"><i class="fas fa-users"></i> <span>Farmers</span></a></li>
            <li class="nav-item"><a href="claims.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i> <span>Claims & Weather</span></a></li>
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-chart-line"></i> <span>Market Trends</span></a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <div class="welcome-text">
                <h1>Farmer Records</h1>
                <p>Register new farmers and manage existing records.</p>
            </div>
        </header>

        <!-- Register New Farmer -->
        <div class="form-card">
            <h3 style="margin-bottom: 1rem;">Register New Farmer</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Farmer Name</label>
                    <input type="text" id="reg-name" placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label>District</label>
                    <input type="text" id="reg-district" placeholder="e.g. Vidisha">
                </div>
                <div class="form-group">
                    <label>Land Area (Acres)</label>
                    <input type="number" id="reg-land" placeholder="e.g. 3.5">
                </div>
                <div class="form-group">
                    <label>Main Crop</label>
                    <select id="reg-crop">
                        <option value="">Select Crop...</option>
                    </select>
                </div>
            </div>
            <button class="sync-btn" style="background-color: var(--primary); color: white;" onclick="registerFarmer()">
                <i class="fas fa-plus"></i> Register Farmer
            </button>
        </div>

        <!-- Farmers Table -->
        <div class="card">
            <div class="card-title">
                All Registered Farmers
                <input type="text" id="search" placeholder="Search..." oninput="renderFarmers()" style="padding: 0.5rem; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.875rem;">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>District</th>
                            <th>Land Area</th>
                            <th>Policy Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="farmers-body">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Details Modal -->
        <div id="details-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <div id="modal-inner">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = "http://localhost:5000/api";
        let farmersData = [];

        async function loadFarmers() {
            try {
                // Using analysis endpoint to get has_policy status
                const res = await fetch(`${API}/farmers/analysis`);
                farmersData = await res.json();
                renderFarmers();
            } catch (e) {
                console.error("Load Error:", e);
            }
        }

        function renderFarmers() {
            const tbody = document.getElementById("farmers-body");
            const q = document.getElementById("search").value.toLowerCase();
            
            const filtered = farmersData.filter(f => 
                f.name.toLowerCase().includes(q) || 
                f.district.toLowerCase().includes(q)
            );

            tbody.innerHTML = filtered.map(f => `
                <tr>
                    <td>${f.farmer_id}</td>
                    <td style="font-weight:600;">${f.name}</td>
                    <td>${f.district}</td>
                    <td>${f.land_area} Acres</td>
                    <td><span class="badge ${f.has_policy ? 'badge-success' : 'badge-info'}">${f.has_policy ? 'Policy Applied' : 'No Policy'}</span></td>
                    <td>
                        <button class="sync-btn" style="padding: 4px 10px; font-size: 11px; margin-right: 5px;" onclick="quickClaim(${f.farmer_id})">
                            <i class="fas fa-bolt"></i> Quick Claim
                        </button>
                        <button class="sync-btn" style="padding: 4px 10px; font-size: 11px; background-color: #f1f5f9; color: #1e293b;" onclick="showDetails(${f.farmer_id})">
                            <i class="fas fa-info-circle"></i> Details
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function showDetails(id) {
            const modal = document.getElementById('details-modal');
            modal.style.display = 'flex';
            const content = document.getElementById('modal-inner');
            content.innerHTML = '<p class="loading">Loading intelligence...</p>';

            try {
                const res = await fetch(`${API}/farmers/${id}`);
                const data = await res.json();
                const p = data.portfolio;

                content.innerHTML = `
                    <h2 style="color:var(--primary);">${p.Name}</h2>
                    <p style="color:var(--text-muted); font-size:0.875rem;">Farmer ID: #${p.Farmer_ID} | ${p.District}</p>
                    
                    <div class="detail-grid">
                        <div class="detail-item"><h4>Land Area</h4><p>${p.Land_Area} Acres</p></div>
                        <div class="detail-item"><h4>Total Policies</h4><p>${p.Total_Policies}</p></div>
                        <div class="detail-item"><h4>Claims Filed</h4><p>${p.Total_Claims}</p></div>
                        <div class="detail-item"><h4>Crops</h4><p>${p.Crops_Grown || 'None listed'}</p></div>
                    </div>
                    
                    <div style="margin-top:2rem;">
                        <h4 style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.5rem;">Active Policies</h4>
                        ${data.policies.length ? data.policies.map(pol => `
                            <div style="background:#f8fafc; padding:10px; border-radius:8px; margin-bottom:8px; border-left:4px solid var(--primary);">
                                <div style="display:flex; justify-content:space-between;">
                                    <span style="font-weight:600;">#${pol.Policy_ID}</span>
                                    <span style="color:var(--success);">₹${pol.Sum_Insured}</span>
                                </div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">Ends: ${pol.End_Date}</div>
                            </div>
                        `).join('') : '<p>No active policies</p>'}
                    </div>
                `;
            } catch (e) { content.innerHTML = '<p>Error loading data.</p>'; }
        }

        function closeModal() {
            document.getElementById('details-modal').style.display = 'none';
        }

        async function loadCrops() {
            try {
                const res = await fetch(`${API}/crops`);
                const crops = await res.json();
                const select = document.getElementById('reg-crop');
                crops.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.Crop_ID;
                    opt.textContent = `${c.Crop_Name} (${c.Season})`;
                    select.appendChild(opt);
                });
            } catch (e) { console.error("Crops load error:", e); }
        }

        async function registerFarmer() {
            const payload = {
                name: document.getElementById('reg-name').value,
                district: document.getElementById('reg-district').value,
                land_area: document.getElementById('reg-land').value,
                crop_id: document.getElementById('reg-crop').value
            };

            if(!payload.name || !payload.district || !payload.land_area) {
                alert("Please fill all fields");
                return;
            }

            try {
                const res = await fetch(`${API}/farmers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await res.json();
                if (res.ok) {
                    alert(d.message);
                    loadFarmers(); // Reload list
                    // Clear fields
                    document.getElementById('reg-name').value = '';
                    document.getElementById('reg-district').value = '';
                    document.getElementById('reg-land').value = '';
                    document.getElementById('reg-crop').value = '';
                } else {
                    alert("Error: " + d.error);
                }
            } catch (e) {
                alert("Could not connect to server.");
            }
        }

        async function quickClaim(farmerId) {
            if(!confirm("Grant immediate Relief Policy and file Pending Claim for this farmer?")) return;
            
            try {
                const res = await fetch(`${API}/farmers/quick-claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ farmer_id: farmerId })
                });
                const d = await res.json();
                if(res.ok) {
                    alert(d.message);
                    loadFarmers();
                } else {
                    alert("Error: " + d.error);
                }
            } catch (e) { alert("Server error"); }
        }

        loadFarmers();
        loadCrops();
    </script>
</body>
</html>
