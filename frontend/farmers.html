<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Farmers — Crop Insurance System</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">CI</div>
      <span>Crop Insurance System</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="farmers.html" class="active">Farmers</a>
      <a href="claims.html">Claims</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Farmer Records</h1>
      <p>All registered farmers with their policy and claim summary</p>
    </div>

    <div class="card">
      <div class="card-header">
        All Farmers
        <input id="search" class="search-input" placeholder="Search by name or district..." oninput="renderFarmers()" />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>District</th>
              <th>Land Area (Acres)</th>
              <th>Policies</th>
              <th>Claims</th>
            </tr>
          </thead>
          <tbody id="farmers-body">
            <tr>
              <td colspan="6" class="loading">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const API = "http://localhost:5000/api";
    let farmers = [];

    async function loadFarmers() {
      try {
        const res = await fetch(`${API}/farmers`);
        farmers = await res.json();
        console.log("FARMERS DATA:", farmers);
        renderFarmers();
      } catch (e) {
        document.getElementById("farmers-body").innerHTML =
          `<tr><td colspan="6" class="loading">Could not connect to backend server.</td></tr>`;
      }
    }

    function renderFarmers() {
      const tbody = document.getElementById("farmers-body");
      const q = document.getElementById("search").value.toLowerCase();

      const data = farmers.filter(f =>
        String(f.name || "").toLowerCase().includes(q) ||
        String(f.district || "").toLowerCase().includes(q)
      );

      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="loading">No farmers found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(f => `
    <tr>
      <td>${f.farmer_id}</td>
      <td>${f.name}</td>
      <td>${f.district}</td>
      <td>${f.land_area}</td>
      <td><span class="badge">${f.total_policies}</span></td>
      <td><span class="badge">${f.total_claims}</span></td>
    </tr>
  `).join("");
    }

    loadFarmers();
  </script>

</body>

</html>
