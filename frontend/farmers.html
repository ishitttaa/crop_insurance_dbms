<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Farmers — Crop Insurance System</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <div class="nav-logo">CI</div>
    <span>Crop Insurance System</span>
  </div>
  <div class="nav-links">
    <a href="index.html">Dashboard</a>
    <a href="farmers.html" class="active">Farmers</a>
    <a href="claims.html">Claims</a>
  </div>
</nav>

<main class="container">
  <div class="page-header">
    <h1>Farmer Records</h1>
    <p>All registered farmers with their policy and claim summary</p>
  </div>

  <div class="card">
    <div class="card-header">
      All Farmers
      <input type="text" id="search" placeholder="Search by name or district..."
             oninput="filterTable()" class="search-input"/>
    </div>
    <div class="table-wrap">
      <table id="farmers-table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>District</th>
            <th>Land Area (acres)</th><th>Policies</th><th>Claims</th>
          </tr>
        </thead>
        <tbody id="farmers-body">
          <tr><td colspan="6" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
const API = 'http://localhost:5000/api';
let allFarmers = [];

async function loadFarmers() {
  try {
    const res = await fetch(`${API}/farmers`);
    allFarmers = await res.json();
    renderTable(allFarmers);
  } catch(e) {
    document.getElementById('farmers-body').innerHTML =
      '<tr><td colspan="6" class="loading">Could not connect to backend server.</td></tr>';
  }
}

function renderTable(data) {
  const tbody = document.getElementById('farmers-body');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">No records found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(f => `
    <tr>
      <td>${f.FARMER_ID}</td>
      <td>${f.NAME}</td>
      <td>${f.DISTRICT}</td>
      <td>${f.LAND_AREA}</td>
      <td><span class="badge-num">${f.TOTAL_POLICIES}</span></td>
      <td><span class="badge-num">${f.TOTAL_CLAIMS}</span></td>
    </tr>`).join('');
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  renderTable(allFarmers.filter(f =>
    f.NAME.toLowerCase().includes(q) || f.DISTRICT.toLowerCase().includes(q)
  ));
}

loadFarmers();
</script>
</body>
</html>
